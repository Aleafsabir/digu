version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: holhuashi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - holhuashi-net
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holhuashi-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-thaasbai_digu}
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=*
    networks:
      - holhuashi-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: holhuashi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - holhuashi-net

  postgres:
    image: postgres:16-alpine
    container_name: holhuashi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-thaasbai_digu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - holhuashi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-thaasbai_digu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: holhuashi-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-thaasbai_digu}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - S3_ENDPOINT=https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      - S3_BUCKET=${R2_BUCKET_NAME}
      - S3_KEY_ID=${R2_ACCESS_KEY_ID}
      - S3_KEY_SECRET=${R2_SECRET_ACCESS_KEY}
    networks:
      - holhuashi-net
    depends_on:
      - postgres

networks:
  holhuashi-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
