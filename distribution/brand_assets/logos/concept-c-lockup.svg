    <g transform="translate(128, 128) rotate(0) translate(-128, -128)">
      <rect x="106" y="24" width="44" height="64" rx="6" fill="#FBF8F2" stroke="#E5C378" stroke-width="2.5"/>
      <path d="M 128 42 C 125 48, 117 56, 117 60 C 117 64, 121 66, 124 66 C 126 66, 127 65, 128 64 C 129 65, 130 66, 132 66 C 135 66, 139 64, 139 60 C 139 56, 131 48, 128 42 Z" fill="#0D0605"/>
      <polygon points="127,64 125,70 131,70 129,64" fill="#0D0605"/>
    </g>
    <g transform="translate(128, 128) rotate(90) translate(-128, -128)">
      <rect x="106" y="24" width="44" height="64" rx="6" fill="#FBF8F2" stroke="#E5C378" stroke-width="2.5"/>
      <path d="M 128 44 C 124 38, 116 38, 116 46 C 116 56, 128 66, 128 66 C 128 66, 140 56, 140 46 C 140 38, 132 38, 128 44 Z" fill="#C62828"/>
    </g>
    <g transform="translate(128, 128) rotate(180) translate(-128, -128)">
      <rect x="106" y="24" width="44" height="64" rx="6" fill="#FBF8F2" stroke="#E5C378" stroke-width="2.5"/>
      <circle cx="128" cy="48" r="5" fill="#0D0605"/>
      <circle cx="123" cy="56" r="5" fill="#0D0605"/>
      <circle cx="133" cy="56" r="5" fill="#0D0605"/>
      <polygon points="127,56 125,66 131,66 129,56" fill="#0D0605"/>
    </g>
    <g transform="translate(128, 128) rotate(270) translate(-128, -128)">
      <rect x="106" y="24" width="44" height="64" rx="6" fill="#FBF8F2" stroke="#E5C378" stroke-width="2.5"/>
      <polygon points="128,42 137,55 128,68 119,55" fill="#C62828"/>
    </g>

    <!-- Central Rosette -->
    <circle cx="128" cy="128" r="32" fill="#0D0605" stroke="#E5C378" stroke-width="3"/>
    <polygon points="128,98 134,122 158,128 134,134 128,158 122,134 98,128 122,122" fill="#E5C378"/>
    <polygon points="128,108 132,124 148,128 132,132 128,148 124,132 108,128 124,124" fill="#00A896" transform="rotate(45 128 128)"/>
    <circle cx="128" cy="128" r="6" fill="#C62828" stroke="#E5C378" stroke-width="1.5"/>
  </g>

  <!-- Right Logotype Section -->
  <g transform="translate(276, 50)">
    <text x="460" y="24" text-anchor="end" font-family="'MV Waheed', 'Faruma', sans-serif" font-weight="bold" font-size="22" fill="#00A896" letter-spacing="2">ހޮޅުއަށި</text>
    <text x="0" y="86" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="800" font-size="64" fill="#FBF8F2" letter-spacing="6">HOLHUASHI</text>

    <!-- Star Divider -->
    <line x1="0" y1="112" x2="200" y2="112" stroke="#00A896" stroke-width="2"/>
    <polygon points="216,104 220,112 228,112 222,116 224,124 216,119 208,124 210,116 204,112 212,112" fill="#E5C378"/>
    <line x1="232" y1="112" x2="460" y2="112" stroke="#00A896" stroke-width="2"/>

    <text x="2" y="146" font-family="'Plus Jakarta Sans', Montserrat, sans-serif" font-weight="700" font-size="16" fill="#E5C378" letter-spacing="5">MALDIVIAN RUMMY &amp; CARDS</text>
