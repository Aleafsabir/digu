<svg fill="#e5c378" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><title>Holhuashi Stacked Lockup</title>
  

  <!-- Centered Symbol (256x256 scaled to 220px, centered at x=256, y=140) -->
  <g transform="translate(146, 25) scale(0.859375)">
    <!-- Base Medallion -->
    <circle cx="128" cy="128" r="120" fill="#e5c378" stroke="#e5c378" stroke-width="6"/>
    <circle cx="128" cy="128" r="108" fill="none" stroke="#e5c378" stroke-width="3"/>

    <!-- Pavilion Roof Canopy -->
    <path d="M 28 104 C 56 90, 96 64, 128 42 C 160 64, 200 90, 228 104 C 216 108, 196 106, 186 100 C 164 80, 144 68, 128 58 C 112 68, 92 80, 70 100 C 60 106, 40 108, 28 104 Z" fill="#e5c378"/>
    <polygon points="124,42 128,18 132,42" fill="#e5c378"/>
    <circle cx="128" cy="18" r="6" fill="#e5c378"/>

    <!-- Left Fanned Card -->
    <g transform="translate(86, 130) rotate(-15)">
      <rect x="-24" y="-38" width="48" height="76" rx="6" fill="#e5c378" stroke="#e5c378" stroke-width="3"/>
      <path d="M 0 -10 C -4 -16, -12 -16, -12 -8 C -12 2, 0 12, 0 12 C 0 12, 12 2, 12 -8 C 12 -16, 4 -16, 0 -10 Z" fill="#e5c378"/>
    </g>

    <!-- Right Fanned Card -->
    <g transform="translate(170, 130) rotate(15)">
      <rect x="-24" y="-38" width="48" height="76" rx="6" fill="#e5c378" stroke="#e5c378" stroke-width="3"/>
      <polygon points="0,-14 11,0 0,14 -11,0" fill="#e5c378"/>
    </g>

    <!-- Center Ace Card -->
    <rect x="98" y="82" width="60" height="96" rx="8" fill="#e5c378" stroke="#e5c378" stroke-width="4"/>
    <path d="M 106 104 L 109 94 L 112 104 M 107 101 L 111 101" fill="none" stroke="#e5c378" stroke-width="2" stroke-linecap="round"/>
    <path d="M 144 158 L 147 168 L 150 158 M 145 161 L 149 161" fill="none" stroke="#e5c378" stroke-width="2" stroke-linecap="round"/>

    <!-- Spade -->
    <path d="M 128 106 C 124 116, 110 130, 110 138 C 110 145, 116 150, 122 150 C 126 150, 127 148, 128 146 C 129 148, 130 150, 134 150 C 140 150, 146 145, 146 138 C 146 130, 132 116, 128 106 Z" fill="#e5c378" stroke="#e5c378" stroke-width="2"/>
    <polygon points="126,146 123,158 133,158 130,146" fill="#e5c378"/>

    <!-- Base Rails -->
    <rect x="44" y="186" width="168" height="10" rx="5" fill="#e5c378"/>
    <rect x="56" y="202" width="144" height="6" rx="3" fill="#e5c378"/>
    <circle cx="128" cy="191" r="3.5" fill="#e5c378"/>
    <circle cx="88" cy="191" r="3.5" fill="#e5c378"/>
    <circle cx="168" cy="191" r="3.5" fill="#e5c378"/>
  </g>

  <!-- Typography Stacked Below -->
  <g transform="translate(256, 305)" text-anchor="middle">
    <!-- Thaana Cultural Script -->
    <text x="0" y="22" font-family="'MV Waheed', 'Faruma', sans-serif" font-weight="bold" font-size="24" fill="#e5c378" letter-spacing="4">ހޮޅުއަށި</text>

    <!-- Primary Brand Wordmark -->
    <text x="0" y="80" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="800" font-size="54" fill="#e5c378" letter-spacing="6">HOLHUASHI</text>

    <!-- Divider Bar -->
    <line x1="-160" y1="106" x2="-20" y2="106" stroke="#e5c378" stroke-width="2"/>
    <polygon points="0,100 8,106 0,112 -8,106" fill="#e5c378" stroke="#e5c378" stroke-width="1.5"/>
    <line x1="20" y1="106" x2="160" y2="106" stroke="#e5c378" stroke-width="2"/>

    <!-- Subtitle -->
    <text x="0" y="140" font-family="'Plus Jakarta Sans', Montserrat, sans-serif" font-weight="700" font-size="15" fill="#e5c378" letter-spacing="4">MALDIVIAN RUMMY &amp; CARDS</text>
  </g>
</svg>
