<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="p2-felt" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2d120d" />
      <stop offset="60%" stop-color="#140705" />
      <stop offset="100%" stop-color="#080202" />
    </radialGradient>
    <linearGradient id="p2-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="40%" stop-color="#e5c378" />
      <stop offset="100%" stop-color="#9a7021" />
    </linearGradient>
    <linearGradient id="p2-cardback" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1811" />
      <stop offset="50%" stop-color="#3b0805" />
      <stop offset="100%" stop-color="#140302" />
    </linearGradient>
    <filter id="p2-cardshadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.95" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#p2-felt)" />

  <!-- Corner Flourish -->
  <path d="M40 40 L90 40 M40 40 L40 90" stroke="#e5c378" stroke-width="2" opacity="0.3" fill="none" />
  <path d="M472 40 L422 40 M472 40 L472 90" stroke="#e5c378" stroke-width="2" opacity="0.3" fill="none" />
  <path d="M40 472 L90 472 M40 472 L40 422" stroke="#e5c378" stroke-width="2" opacity="0.3" fill="none" />
  <path d="M472 472 L422 472 M472 472 L472 422" stroke="#e5c378" stroke-width="2" opacity="0.3" fill="none" />

  <!-- Background Card -->
  <g transform="translate(230, 260) rotate(-16) translate(-140, -200)" filter="url(#p2-cardshadow)">
    <rect width="260" height="390" rx="22" fill="#ffffff" />
    <rect x="10" y="10" width="240" height="370" rx="16" fill="url(#p2-cardback)" />
    <rect x="16" y="16" width="228" height="358" rx="12" fill="none" stroke="url(#p2-gold)" stroke-width="2.5" />
    <g stroke="#e5c378" stroke-width="1.5" opacity="0.4" fill="none">
      <path d="M130 50 L220 195 L130 340 L40 195 Z" />
      <circle cx="130" cy="195" r="42" stroke="url(#p2-gold)" stroke-width="3" />
      <text x="130" y="210" text-anchor="middle" font-family="'Noto Sans Thaana', sans-serif" font-weight="900" font-size="44" fill="#e5c378">ޑ</text>
    </g>
  </g>

  <!-- Foreground Card -->
  <g transform="translate(265, 275) rotate(8) translate(-140, -200)" filter="url(#p2-cardshadow)">
    <rect width="270" height="400" rx="24" fill="#fcfbfa" />
    <rect x="8" y="8" width="254" height="384" rx="18" fill="none" stroke="#d5cebe" stroke-width="1" />
    <text x="32" y="58" font-family="'Cinzel', serif" font-weight="900" font-size="42" fill="#120605">A</text>
    <path d="M32 72 C28 77 22 83 22 88 C22 92 25 94 28 94 C30 94 31 93 32 91 C33 93 34 94 36 94 C39 94 42 92 42 88 C42 83 36 77 32 72 Z" fill="#120605" />
    <path d="M31 91 L29 97 L35 97 L33 91 Z" fill="#120605" />

    <!-- Center Ace of Spades Crest -->
    <g transform="translate(135, 195)">
      <path d="M0 -90 C-45 -25 -82 12 -82 48 C-82 78 -58 92 -28 92 C-14 92 -2 84 0 72 C2 84 14 92 28 92 C58 92 82 78 82 48 C82 12 45 -25 0 -90 Z" fill="#170908" />
      <path d="-10 65 L-24 106 L24 106 L10 65 Z" fill="#170908" />
      <path d="M0 -70 C-32 -18 -60 12 -60 42 C-60 62 -42 74 -22 74 C-10 74 -2 68 0 58 C2 68 10 74 22 74 C42 74 60 62 60 42 C60 12 32 -18 0 -70 Z" fill="none" stroke="url(#p2-gold)" stroke-width="3" />
      <circle cx="0" cy="22" r="28" fill="#a82b18" stroke="url(#p2-gold)" stroke-width="2.5" />
      <text x="0" y="32" text-anchor="middle" font-family="'Noto Sans Thaana', sans-serif" font-weight="900" font-size="30" fill="#fff5cf">ޑ</text>
      <text x="0" y="-12" text-anchor="middle" font-family="'Cinzel', serif" font-weight="900" font-size="12" fill="url(#p2-gold)" letter-spacing="4">MALDIVES</text>
    </g>
  </g>

  <!-- Gold Sparkle -->
  <g transform="translate(370, 110)">
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="url(#p2-gold)" opacity="0.9" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
</svg>
