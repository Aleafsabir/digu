<svg viewBox="0 0 432 432" width="432" height="432" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="40%" stop-color="#e5c378" />
      <stop offset="100%" stop-color="#9a7021" />
    </linearGradient>

    <linearGradient id="fg-cardback" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1811" />
      <stop offset="50%" stop-color="#3b0805" />
      <stop offset="100%" stop-color="#140302" />
    </linearGradient>

    <filter id="fg-cardshadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Scale & Center within the 72dp (288px) Safe Zone Circle -->
  <g transform="translate(216, 222) scale(0.68) translate(-256, -260)">
    
    <!-- Background Card (Angled -16°, Royal Lacquer Back) -->
    <g transform="translate(225, 265) rotate(-16) translate(-140, -205)" filter="url(#fg-cardshadow)">
      <rect width="270" height="400" rx="22" fill="#ffffff" />
      <rect x="10" y="10" width="250" height="380" rx="16" fill="url(#fg-cardback)" />
      <rect x="16" y="16" width="238" height="368" rx="12" fill="none" stroke="url(#fg-gold)" stroke-width="2.5" />
      
      <g stroke="url(#fg-gold)" stroke-width="1.5" opacity="0.45" fill="none">
        <path d="M135 45 L230 200 L135 355 L40 200 Z" />
        <circle cx="135" cy="200" r="44" stroke="url(#fg-gold)" stroke-width="3" />
        <text x="135" y="215" text-anchor="middle" font-family="'Noto Sans Thaana', 'Faruma', sans-serif" font-weight="900" font-size="44" fill="#e5c378">ޑ</text>
      </g>
    </g>

    <!-- Foreground Card (Angled +8°, Maldivian Ace of Spades) -->
    <g transform="translate(270, 275) rotate(8) translate(-140, -205)" filter="url(#fg-cardshadow)">
      <rect width="275" height="405" rx="24" fill="#fcfbfa" />
      <rect x="8" y="8" width="259" height="389" rx="18" fill="none" stroke="#d5cebe" stroke-width="1.2" />

      <!-- Top Left Corner Index -->
      <text x="32" y="60" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="44" fill="#140604">A</text>
      <path d="M32 74 C28 79 22 85 22 90 C22 94 25 96 28 96 C30 96 31 95 32 93 C33 95 34 96 36 96 C39 96 42 94 42 90 C42 85 36 79 32 74 Z" fill="#140604" />
      <path d="M31 93 L29 99 L35 99 L33 93 Z" fill="#140604" />

      <!-- Bottom Right Corner Index -->
      <g transform="translate(243, 345) rotate(180)">
        <text x="0" y="0" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="44" fill="#140604">A</text>
        <path d="M0 14 C-4 19 -10 25 -10 30 C-10 34 -7 36 -4 36 C-2 36 -1 35 0 33 C1 35 2 36 4 36 C7 36 10 34 10 30 C10 25 4 19 0 14 Z" fill="#140604" />
        <path d="-1 33 L-3 39 L3 39 L1 33 Z" fill="#140604" />
      </g>

      <!-- Center Ace of Spades Crest -->
      <g transform="translate(137, 200)">
        <path d="M0 -92 C-46 -26 -84 12 -84 50 C-84 80 -60 94 -30 94 C-15 94 -2 86 0 74 C2 86 15 94 30 94 C60 94 84 80 84 50 C84 12 46 -26 0 -92 Z" fill="#160806" />
        <path d="M-11 68 L-25 108 L25 108 L11 68 Z" fill="#160806" />
        <path d="M0 -72 C-34 -18 -62 14 -62 44 C-62 64 -44 76 -24 76 C-11 76 -2 70 0 60 C2 70 11 76 24 76 C44 76 62 64 62 44 C62 14 34 -18 0 -72 Z" fill="none" stroke="url(#fg-gold)" stroke-width="3" />
        <circle cx="0" cy="24" r="29" fill="#a82b18" stroke="url(#fg-gold)" stroke-width="2.5" />
        <text x="0" y="34" text-anchor="middle" font-family="'Noto Sans Thaana', 'Faruma', sans-serif" font-weight="900" font-size="32" fill="#fff5cf">ޑ</text>
        <text x="0" y="-14" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="12" fill="url(#fg-gold)" letter-spacing="4">MALDIVES</text>
      </g>
    </g>

    <!-- Top Right Sparkle -->
    <g transform="translate(378, 108)">
      <polygon points="0,-20 4,-5 20,0 4,5 0,20 -4,5 -20,0 -4,-5" fill="url(#fg-gold)" opacity="0.95" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>
  </g>
</svg>
