name: holhuashi_client
description: "Holhuashi: Authentic Maldivian Card Games (Digu, Bondi, Dhihaeh) built with Flutter and Flame Engine."
publish_to: 'none'
version: 0.8.1+22

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # 2D Game Engine & Physics
  flame: ^1.20.0
  flame_audio: ^2.1.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Real-time WebSocket Client
  web_socket_channel: ^3.0.1

  # Local preferences & settings
  shared_preferences: ^2.3.2

  # Google Sign-In & HTTP networking
  google_sign_in: ^6.2.1
  http: ^1.2.2

  # Icons & Utilities
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Asset bundles: Sounds & Audio
  assets:
    - assets/audio/
