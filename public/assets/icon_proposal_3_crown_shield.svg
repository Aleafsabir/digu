    <circle cx="44" cy="-24" r="4.5" fill="#ffffff" />
  </g>

  <!-- Monolithic Spade with Negative Space 'ޑ' -->
  <g transform="translate(256, 268)" filter="url(#p3-shieldshadow)">
    <path d="M0 -105 C-56 -30 -100 15 -100 58 C-100 95 -70 112 -34 112 C-16 112 -4 102 0 88 C4 102 16 112 34 112 C70 112 100 95 100 58 C100 15 56 -30 0 -105 Z" fill="url(#p3-gold)" />
