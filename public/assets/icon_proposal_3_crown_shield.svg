  <g filter="url(#p3-shieldshadow)">
    <path d="M256 42 L414 88 C414 260 348 380 256 448 C164 380 98 260 98 88 Z" fill="#140604" stroke="url(#p3-cinnabar)" stroke-width="10" />
    <path d="M256 58 L398 98 C398 250 338 362 256 428 C174 362 114 250 114 98 Z" fill="url(#p3-bg)" stroke="url(#p3-gold)" stroke-width="3" />
  </g>

  <!-- Sultanate Crown -->
  <g transform="translate(256, 126)" filter="url(#p3-shieldshadow)">
    <path d="M-64 12 L-44 -22 L-16 0 L0 -30 L16 0 L44 -22 L64 12 Z" fill="url(#p3-gold)" />
    <circle cx="-44" cy="-24" r="4.5" fill="#ffffff" />
