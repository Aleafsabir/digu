<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="p3-bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1f0a07" />
      <stop offset="60%" stop-color="#0c0403" />
      <stop offset="100%" stop-color="#050101" />
    </radialGradient>
    <linearGradient id="p3-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a6c1e" />
      <stop offset="25%" stop-color="#eecb77" />
      <stop offset="50%" stop-color="#fff8db" />
      <stop offset="75%" stop-color="#dca53b" />
      <stop offset="100%" stop-color="#8a5a12" />
    </linearGradient>
    <linearGradient id="p3-cinnabar" x1="0%" y1="0%" x2="100%" y2="100%">
