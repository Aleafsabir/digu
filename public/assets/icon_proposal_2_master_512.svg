<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Crimson Felt Table Radial -->
    <radialGradient id="p2-felt" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2d120d" />
      <stop offset="60%" stop-color="#140705" />
      <stop offset="100%" stop-color="#080202" />
    </radialGradient>

    <!-- 24K Royal Gold Gradient -->
    <linearGradient id="p2-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="40%" stop-color="#e5c378" />
      <stop offset="100%" stop-color="#9a7021" />
    </linearGradient>

    <!-- Royal Lacquer Card Back Texture -->
    <linearGradient id="p2-cardback" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1811" />
      <stop offset="50%" stop-color="#3b0805" />
      <stop offset="100%" stop-color="#140302" />
    </linearGradient>

    <!-- Deep Organic Physical Card Drop Shadow -->
    <filter id="p2-cardshadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <filter id="p2-subtleshadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Table Felt Ground (Squircle 512px) -->
  <rect width="512" height="512" rx="112" fill="url(#p2-felt)" />

  <!-- Corner Filigree Flourish (Casino Felt Table Inlay) -->
  <g opacity="0.35" stroke="url(#p2-gold)" stroke-width="2" fill="none">
    <path d="M48 48 L104 48 M48 48 L48 104 M58 58 L86 58 M58 58 L58 86" />
    <path d="M464 48 L408 48 M464 48 L464 104 M454 58 L426 58 M454 58 L454 86" />
    <path d="M48 464 L104 464 M48 464 L48 408 M58 454 L86 454 M58 454 L58 426" />
    <path d="M464 464 L408 464 M464 464 L464 408 M454 454 L426 454 M454 454 L454 426" />
  </g>

  <!-- Card 1: Background Card (Angled -16°, Royal Lacquer Burgundy Back) -->
  <g transform="translate(225, 265) rotate(-16) translate(-140, -205)" filter="url(#p2-cardshadow)">
    <!-- White Card Border Frame -->
    <rect width="270" height="400" rx="22" fill="#ffffff" />
    <!-- Burgundy Lacquer Fill -->
    <rect x="10" y="10" width="250" height="380" rx="16" fill="url(#p2-cardback)" />
    <!-- Gold Pinstripe Inlay -->
    <rect x="16" y="16" width="238" height="368" rx="12" fill="none" stroke="url(#p2-gold)" stroke-width="2.5" />
    
    <!-- Geometric Diamond Lattice Pattern -->
    <g stroke="url(#p2-gold)" stroke-width="1.5" opacity="0.45" fill="none">
      <path d="M135 45 L230 200 L135 355 L40 200 Z" />
      <circle cx="135" cy="200" r="44" stroke="url(#p2-gold)" stroke-width="3" />
      <text x="135" y="215" text-anchor="middle" font-family="'Noto Sans Thaana', 'Faruma', sans-serif" font-weight="900" font-size="44" fill="#e5c378">ޑ</text>
    </g>
  </g>

  <!-- Card 2: Foreground Card (Angled +8°, The Gilded Maldivian Ace of Spades) -->
  <g transform="translate(270, 275) rotate(8) translate(-140, -205)" filter="url(#p2-cardshadow)">
    <!-- Crisp Physical Ivory Card Body with Rounded Bevel -->
    <rect width="275" height="405" rx="24" fill="#fcfbfa" />
    <rect x="8" y="8" width="259" height="389" rx="18" fill="none" stroke="#d5cebe" stroke-width="1.2" />

    <!-- Top Left Corner Index: Stacked 'A' over Spade Pip -->
    <text x="32" y="60" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="44" fill="#140604">A</text>
    <path d="M32 74 C28 79 22 85 22 90 C22 94 25 96 28 96 C30 96 31 95 32 93 C33 95 34 96 36 96 C39 96 42 94 42 90 C42 85 36 79 32 74 Z" fill="#140604" />
    <path d="M31 93 L29 99 L35 99 L33 93 Z" fill="#140604" />

    <!-- Bottom Right Corner Index (Inverted 180°) -->
    <g transform="translate(243, 345) rotate(180)">
      <text x="0" y="0" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="44" fill="#140604">A</text>
      <path d="M0 14 C-4 19 -10 25 -10 30 C-10 34 -7 36 -4 36 C-2 36 -1 35 0 33 C1 35 2 36 4 36 C7 36 10 34 10 30 C10 25 4 19 0 14 Z" fill="#140604" />
      <path d="-1 33 L-3 39 L3 39 L1 33 Z" fill="#140604" />
    </g>

    <!-- CENTER ORNATE ACE OF SPADES CREST -->
    <g transform="translate(137, 200)">
      <!-- Main Spade Silhouette -->
      <path d="M0 -92 C-46 -26 -84 12 -84 50 C-84 80 -60 94 -30 94 C-15 94 -2 86 0 74 C2 86 15 94 30 94 C60 94 84 80 84 50 C84 12 46 -26 0 -92 Z" fill="#160806" />
      <!-- Spade Stem Foot -->
      <path d="M-11 68 L-25 108 L25 108 L11 68 Z" fill="#160806" />

      <!-- Inner Acanthus Vine Inlay in 24K Gold -->
      <path d="M0 -72 C-34 -18 -62 14 -62 44 C-62 64 -44 76 -24 76 C-11 76 -2 70 0 60 C2 70 11 76 24 76 C44 76 62 64 62 44 C62 14 34 -18 0 -72 Z" fill="none" stroke="url(#p2-gold)" stroke-width="3" />
      
      <!-- Central Cinnabar Rose Medallion with Gold 'ޑ' -->
      <circle cx="0" cy="24" r="29" fill="#a82b18" stroke="url(#p2-gold)" stroke-width="2.5" />
      <text x="0" y="34" text-anchor="middle" font-family="'Noto Sans Thaana', 'Faruma', sans-serif" font-weight="900" font-size="32" fill="#fff5cf">ޑ</text>

      <!-- Sovereign Gold Lettering: MALDIVES -->
      <text x="0" y="-14" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="12" fill="url(#p2-gold)" letter-spacing="4">MALDIVES</text>
    </g>
  </g>

  <!-- Golden Light Sparkle Glint (Top Right Card Corner) -->
  <g transform="translate(378, 108)" filter="url(#p2-subtleshadow)">
    <polygon points="0,-20 4,-5 20,0 4,5 0,20 -4,5 -20,0 -4,-5" fill="url(#p2-gold)" opacity="0.95" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>
</svg>
