<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Holhuashi — Concept B: The Melded Monogram</title>

  <!-- Deep Obsidian Tile -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="#0D0605" stroke="#E5C378" stroke-width="4"/>

  <!-- Subtle Inner Border -->
  <rect x="22" y="22" width="212" height="212" rx="36" fill="none" stroke="#C62828" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Left Card Pillar of the "H" (Ace Card) -->
  <rect x="48" y="44" width="56" height="168" rx="10" fill="#FBF8F2" stroke="#E5C378" stroke-width="3"/>
  <!-- Top Spade Cutout -->
  <path d="M 76 68 C 73 75, 63 85, 63 90 C 63 95, 67 98, 71 98 C 74 98, 75 97, 76 95 C 77 97, 78 98, 81 98 C 85 98, 89 95, 89 90 C 89 85, 79 75, 76 68 Z" fill="#0D0605"/>
  <polygon points="75,95 73,103 79,103 77,95" fill="#0D0605"/>

  <!-- Right Card Pillar of the "H" (Run Partner Card) -->
  <rect x="152" y="44" width="56" height="168" rx="10" fill="#FBF8F2" stroke="#E5C378" stroke-width="3"/>
  <!-- Top Heart Cutout -->
  <path d="M 180 72 C 176 66, 168 66, 168 74 C 168 84, 180 94, 180 94 C 180 94, 192 84, 192 74 C 192 66, 184 66, 180 72 Z" fill="#C62828"/>

  <!-- Interlocking "Meld Bridge" Crossbar (Creating the 'H' and representing Digu runs) -->
  <rect x="100" y="108" width="56" height="40" fill="#C62828" stroke="#E5C378" stroke-width="3"/>

  <!-- Woven Coir / Lacquer Ring Motifs in Crossbar -->
  <line x1="104" y1="118" x2="152" y2="118" stroke="#E5C378" stroke-width="2.5"/>
  <line x1="104" y1="138" x2="152" y2="138" stroke="#E5C378" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="8" fill="#E5C378"/>
  <circle cx="128" cy="128" r="4" fill="#0D0605"/>

  <!-- Crown Accents atop Pillars -->
  <polygon points="66,44 76,32 86,44" fill="#E5C378"/>
  <polygon points="170,44 180,32 190,44" fill="#E5C378"/>

  <!-- Bottom Foundation Bar (Joali Rest) -->
  <rect x="40" y="210" width="176" height="6" rx="3" fill="#E5C378"/>
</svg>
