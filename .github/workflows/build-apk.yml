name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holhuashi-digu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: "Holhuashi: Digu ${{ steps.version_info.outputs.tag }}"
          body: |
            ## Holhuashi: Digu ${{ steps.version_info.outputs.tag }} Release
            - **New App Icon**: "The 1,000-Point Suited Fan" featuring the Maldivian Ace of Spades, 24K gold Dhivehi ޑ, and royal lacquer cardback.
            - **Royal Lacquer Theme**: Default lacquer felt (`#0d0605`), cinnabar vermilion (`#c84b31`), burnished gold (`#e5c378`), and 4-font hierarchy (Noto Sans Thaana, Cinzel, Plus Jakarta Sans, JetBrains Mono).
            - **Physical Brand Vector Deck**: Stacked corner indices for dense hand fanning, double-headed mirrored court portraits, filigree Ace of Spades, and 4 physical card backs.
            - **FastMeldParser Engine**: Sub-millisecond bitmask solver with canonical key memoization for 1,000-point runs and standard 4+3+3 melds.
            - **3-Tier Bot AI Intelligence**: Casual, Holhuashi Regular, and Thulhaadhoo Master with near-meld holds and ruthless -100pt zero-meld penalty defense.
            - **Lyria Stereo Audio & Tactile SFX**: Seamless lobby and table MP3 music streams with live volume controls, plus synthesized card draws, discard thuds, reorder ticks, and Gin chimes.
            - **Streamlined HUD & Split Settings**: Centered minimalist table with dynamic 3D Gin button, exact in-game hand scale, quick In-Game Match settings, and lobby system settings.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
