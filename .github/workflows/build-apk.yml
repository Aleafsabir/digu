name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holhuashi-digu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: "Holhuashi: Digu ${{ steps.version_info.outputs.tag }}"
          body: |
            ## Holhuashi: Digu ${{ steps.version_info.outputs.tag }} Release
            - **Google Cloud Firestore Database**: Permanent cloud persistence for profiles, friend codes (`HLH-XXXXX`), presence, and rooms across Cloud Run sleep/wake cycles.
            - **Guest Profile Auto-Registration**: Guest accounts now automatically register with the global player index so any player is immediately discoverable by friend code.
            - **Gameplay Commentary Overlap Fix**: Bondi and Dhihaeh status messages are docked directly to the Center Trick Arena, completely resolving overlap with North opponent nameplates.
            - **Dhihaeh Trump Declaration Fanfare**: Live 2.5s modal with glowing suit emblems, Dhivehi calligraphy (`ހުކުމް ކަނޑައެޅުން`), and declaring player announcement.
            - **Swipeable Game Mode Carousel**: Smooth horizontal touch swipe and mouse drag gesture support with haptics across Digu, Dhihaeh, and Bondi in the main lobby.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
