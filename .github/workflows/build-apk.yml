name: Build and Verify Holhuashi Client & Server

on:
  push:
    branches: [main, feature/flutter-flame-client]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify, Test & Build (Web + APKs + Server)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Client Dependencies
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

      - name: Build Server Engine & Backend
        run: |
          cd server
          npm ci || npm install
          npm run build

      - name: Build Flutter Web Release
        run: flutter build web --release

      - name: Build Android Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holhuashi-flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holhuashi-flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Web Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holhuashi-web-release
          path: build/web/
          if-no-files-found: ignore
          retention-days: 14
