name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holhuashi-digu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: "Holhuashi: Digu ${{ steps.version_info.outputs.tag }}"
          body: |
            ## Holhuashi: Digu ${{ steps.version_info.outputs.tag }} Release
            - **Google Cloud Data Restoration**: Full multi-device account restoration across Google sign-ins, restoring coin balances, gems, levels, and career stats.
            - **Smart Chip Merge & Conflict Resolution**: Interactive `<CloudConflictModal />` allowing players to retain cloud saves, keep local guest saves, or merge guest chip/gem balances into their cloud account.
            - **Unified Royal Lacquer Design System**: Complete visual harmonization across all 20+ screens, matchmaking radars, modals, and stadium tables in luxury Baa Atoll lacquerware aesthetics.
            - **Seamless APK Updates**: Signed with the permanent keystore to ensure uninterrupted updates without "App not installed" package errors.
            - **Offline Sync Queueing**: Automatic background sync with offline transaction persistence and automatic sync flush on app launch.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
