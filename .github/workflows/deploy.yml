name: CI/CD Pipeline & Live Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build (Frontend, Server & Mobile Shells)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Client Test Suite (Vitest)
        run: npm run test

      - name: Build Client Web Assets (Vite & TypeScript)
        run: npm run build

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Compile Backend Server (TypeScript)
        run: npm --prefix server run build

      - name: Verify Capacitor Mobile Sync
        run: npx cap sync

  deploy-to-fly:
    name: Deploy Backend to Fly.io
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Server to Fly.io
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            flyctl deploy server --remote-only
          else
            echo "FLY_API_TOKEN not set in GitHub Secrets. Skipping automatic Fly deployment."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
